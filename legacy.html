      "report": "AI·클라우드 시장 동향 브리핑\n2026. 10. 21.(수)\n\n□ 핵심 이슈: 추론 비용과 운영 책임\n - IBM·Red Hat·Google Cloud·CoreWeave 등, 분산 추론 오픈소스 llm-d 1.0 공개\n   · llm-d 1.0은 다중 테넌트 우선순위 제어, 무중단 업데이트와 에이전트 세션 인식 라우팅을 포함해 공개됐습니다. 프로젝트 참여사 발표의 기능 범위이며 특정 고객 환경의 운영 안정성을 독립 검증한 결과는 아닙니다.\n   · 참여사들은 현재 클라우드 임대료 기준 해당 벤치마크의 토큰당 비용이 동등 상용 API 대비 5~10배 낮을 수 있다고 제시했습니다. 에이전트 세션 중심의 입력량이 큰 워크로드와 현재 임대료를 가정한 비교로, 다른 모델·하드웨어·운영비에 일반화할 수 없습니다.\n   · 사업 전망: 기회. 다중 고객의 우선순위·세션 라우팅·업데이트를 묶은 공개 추론 기반이 나왔습니다. 삼성SDS는 기존 GPUaaS 위에서 고객별 추론 운영을 제공할 선택지를 비교할 수 있습니다. 판단 조건: 동일 모델·지연시간·가동률에서 인건비와 장애 대응까지 포함한 비용이 관리형 API보다 낮아지는지 확인해야 합니다.\n□ 클라우드 장애와 보안 대응\n - Google Cloud, 런던 europe-west2-b 정전성 장애…다수 서비스 영향 후 대부분 복구\n   · Google은 10월 20일 런던 europe-west2-b의 전력 이벤트가 여러 GCP 서비스 장애를 일으켰으며, 14:03 UTC 기준 대부분 고객은 정상화되고 소수 영향은 남았다고 밝혔습니다. The Register가 인용한 Google Cloud 상태 페이지 기준이며, 런던 리전의 특정 가용영역 사건입니다. 영향 고객·서비스의 최종 범위와 근본 원인 분석은 후속 조사 전입니다.\n   · 사업 전망: 위협. 특정 가용영역의 전력 사건이 여러 관리형 서비스에 영향을 주었습니다. 유사 의존성을 가진 고객 시스템에서는 MSP의 복구 의무와 고객 업무 중단 비용이 커질 수 있습니다. 판단 조건: 최종 사고 분석과 서비스별 영향 범위, 실제 전환 성공 여부가 확인되면 책임과 대응 수준을 구체화할 수 있습니다.\n - Mozilla, eMudhra 후속 대응…원격 차단 미수신 환경용 Firefox·NSS 갱신\n   · Mozilla는 8개 eMudhra 중간 인증서 차단을 표준 Firefox에 OneCRL로 적용했고, 10월 20일 Firefox·ESR 업데이트와 NSS 신뢰 목록 갱신으로 원격 차단을 받지 못하는 일부 사용자·앱까지 추가 보호한다고 발표했습니다. Mozilla의 Firefox·NSS 배포 범위에 한정합니다. 침해 신고는 10월 17일 접수됐으며, 각 OS·런타임·애플리케이션의 패치 상태는 별도 확인이 필요합니다.\n   · 사업 전망: 위협. Mozilla는 원격 폐기 정보를 받지 못하는 사용자와 파생 신뢰 저장소까지 추가 대응했습니다. 기업 IT 운영에서도 런타임별 인증서 목록 갱신 누락이 남을 수 있습니다. 판단 조건: 고객 환경에서 영향을 받는 인증서·신뢰 저장소와 실제 업데이트 버전이 확인되면 조치 대상을 좁힐 수 있습니다.\n□ 기업 AI 제품과 고객 업무\n - Mistral, 50개 이상 언어용 Voxtral 3 음성 에이전트 SDK·모델 공개…자체 배포도 제공\n   · Mistral은 50개 이상 언어를 지원하는 Voxtral 3 음성 에이전트 SDK·모델을 공개하고 EU 호스팅 API와 자체 인프라 배포를 제공한다고 밝혔습니다. 기능·배포 선택지는 Mistral의 제품 발표 기준입니다. 고객 도입, 실제 성능, 지역별 처리·보존 정책 및 계약 조건을 별도로 확인해야 합니다.\n   · 사업 전망: 복합. Mistral이 음성 입력부터 도구 호출·음성 출력까지 연결하는 SDK와 자체 배포를 제시했습니다. 삼성SDS에는 기업 시스템 연계 기회가 생기지만 음성 기능 자체의 별도 개발·판매 가치는 줄어들 수 있습니다. 판단 조건: 한국어 업무 정확도·지연·데이터 처리 계약과 실제 자체 배포 운영비가 확인돼야 도입 경로를 정할 수 있습니다.\n - OpenAI, Orchestra Bio 인수…신약개발용 Rosalind에 과학 에이전트 역량 통합\n   · OpenAI는 Orchestra Bio의 팀과 기술을 생명과학 연구용 제품군 Rosalind에 통합할 계획이며, 인수 금액은 공개하지 않았다고 Axios에 확인했습니다. Axios가 OpenAI의 확인을 인용한 인수 보도입니다. 금액·고객 계약·통합 일정·상용 성과는 확인되지 않았습니다.\n   · Orchestra의 플랫폼은 연구 모니터링, 신약개발 일정 추적, 지연 가능성 식별 업무를 AI 에이전트에 위임하도록 설계됐습니다. 제품의 의도된 기능 설명이며 실제 배포 범위나 생산성 개선 수치를 뜻하지 않습니다.\n   · 사업 전망: 복합. OpenAI가 신약개발 업무 에이전트 팀을 확보해 전문 업무로 범위를 넓힙니다. 삼성SDS의 기업 AI 연계 수요가 늘 수 있지만 범용 에이전트 구현만으로 받는 대가는 압박받을 수 있습니다. 판단 조건: 실제 통합 제품·고객 계약과 외부 시스템 연결 범위가 공개되면 플랫폼이 흡수하는 업무와 서비스사가 맡을 일을 구분할 수 있습니다.\n - Zoom, 기존 고객 확장·장기계약 보상 강화…MSP 전문화는 12월 공개 예정\n   · Zoom은 기존 고객 월 반복매출이 1,000달러 늘 때마다 파트너 1점을 부여하고 계약기간에 비례해 인센티브·리베이트를 높이며, MSP 전문화는 12월 공개할 계획이라고 밝혔습니다. Channel Dive가 Zoom의 발표와 채널 책임자 발언을 보도했습니다. MSP 전문화는 예정이며 제도 효과나 실제 고객 유지 성과는 확인되지 않았습니다.\n   · 사업 전망: 관찰. Zoom이 파트너 보상을 기존 고객 MRR 확대와 계약기간에 연동합니다. 운영·활용 지원에 대가를 붙이는 사례지만 삼성SDS의 해당 파트너 자격과 고객 중복은 확인되지 않았습니다. 판단 조건: 12월 전문화의 실제 자격·보상·서비스 책임 조건이 공개되면 사업 참여 가능성을 판단할 수 있습니다.\n□ 인프라 투자·실적·공급 계약\n - AWS, 2027년 프랑크푸르트 리전 확장에 48억 유로 투자 계획\n   · Amazon은 2027년 독일 투자 계획 160억 유로 중 48억 유로를 AWS Europe (Frankfurt) Region 확장에 사용할 계획이라고 발표했습니다. 2027년 투자 계획액이며 집행 완료·신규 수전 용량·IT부하 또는 개별 시설 가동량은 공개되지 않았습니다.\n   · Amazon의 독일 160억 유로 투자 계획은 AWS 인프라 외에 위성통신·물류·Prime Video 제작 등도 포함합니다. 전체 160억 유로를 데이터센터 지출로 간주할 수 없으며, 데이터센터 관련으로 명시된 금액은 AWS Frankfurt 48억 유로입니다.\n   · 사업 전망: 관찰. AWS가 프랑크푸르트 리전 확장 예산을 구체화했습니다. 독일 클라우드 공급 확대 신호지만 삼성SDS가 수주할 구축·운영 범위나 실제 신규 용량은 확인되지 않았습니다. 판단 조건: 시설별 가동 일정과 현지 고객 발주·파트너 조달이 확인돼야 삼성SDS 사업 기회로 연결할 수 있습니다.\n - OVHcloud, 연결 전력 250MW 중 140MW 가동…기존 시설에 110MW 성장 여력\n   · OVHcloud는 연결 전력 용량이 250MW이고 그중 140MW가 운영 중이라고 FY2026 결과에서 밝혔습니다. 연결 전력과 현재 운영분의 회사 공시 수치이며 GPU·IT부하 용량이나 즉시 판매 가능한 전력을 뜻하지 않습니다.\n   · OVHcloud는 기존 연결 용량으로 신규 부지를 건설하지 않고도 성장할 여력이 있다고 밝혔고, AI 사업은 2027년 배치 단계로 이동할 계획입니다. 회사 계획과 수용 여력 설명입니다. 남은 110MW의 AI 전용 배정, 고객 계약 및 가동 일정은 공개되지 않았습니다.\n   · 사업 전망: 관찰. OVHcloud가 기존 연결 전력과 운영 전력 사이의 여력을 공개했습니다. 공급 확대의 대안은 보이지만 그 여력이 AI GPU 서비스로 전환되는 비용·일정과 삼성SDS 적용 여부는 미확인입니다. 판단 조건: 잔여 전력에 대응하는 서버·냉각 설치와 고객 계약·가동 시점이 확인돼야 판매 가능한 공급으로 판단할 수 있습니다.\n - SpaceX, 3분기 SI 매출 75.6억 달러·설비투자 164.4억 달러 발표\n   · SpaceX의 2026년 3분기 SI 매출은 75억6,000만 달러이고 SI 설비투자는 164억4,400만 달러였습니다. SEC 제출 실적자료의 부문 수치입니다. SI 매출에는 클라우드 서비스 계약, Cursor 인수 및 모델·소프트웨어가 함께 반영돼 순수 외부 GPU 임대 매출로 볼 수 없습니다.\n   · 사업 전망: 복합. SpaceX의 SI 매출 확대와 큰 설비투자가 함께 확인됐습니다. 외부 컴퓨트 공급이 늘면 조달 선택지가 늘 수 있지만 신규 공급자의 내부 수요와 재계약 가격에 대한 불확실성도 커질 수 있습니다. 판단 조건: 외부 임대 가능한 용량·계약 기간·중단권과 확정 공급가격이 공개되면 경쟁·조달 영향을 구체화할 수 있습니다.\n - General Compute, Positron Atlas 구매 및 차세대 Titan 도입 약정…전용 추론 서비스 확대\n   · Positron 발표에 따르면 General Compute는 Atlas 추론 시스템을 구매하고 차세대 Titan 시스템 구매도 약정했습니다. 공급사 보도자료의 발표 내용입니다. 계약 금액·수량·납기와 Titan 배치 일정은 공개되지 않았으며, Titan은 차세대 제품입니다.\n   · 사업 전망: 관찰. General Compute가 범용 GPU 외 추론 시스템 구매를 약정했습니다. 대체 조달 사례이지만 가격·물량·납기와 실제 고객 성능이 없어 삼성SDS 원가 개선 방향은 아직 판단하기 어렵습니다. 판단 조건: 구매 조건·서비스 출시 및 동일 모델의 실제 처리량·운영비가 확인되면 대체 가속기 채택을 비교할 수 있습니다.\n - Supermicro, Q1 FY2027 잠정 매출 전망 185억~195억 달러로 상향…AI 플랫폼 수요 반영\n   · Supermicro IR은 Q1 FY2027 잠정 매출을 185억~195억 달러로 제시하고, 기존 가이던스 145억~155억 달러 대비 상향 원인을 AI 플랫폼 수요 증가로 설명했습니다. 회사가 발표한 미감사 잠정치이며 결산 완료 전입니다. AI 서버 출하량이나 고객별 수요·계약을 별도로 공개한 수치는 아닙니다.\n   · Supermicro IR은 잠정 매출총이익률 12.0~12.5%를 제시했고, 기존 10.4~10.8% 대비 개선 이유를 고객·제품 믹스로 들었습니다. 미감사 경영진 잠정 전망입니다. 고객·제품 믹스의 세부 구성과 개선의 지속성은 이 발표만으로 확인되지 않습니다.\n   · 사업 전망: 관찰. Supermicro의 AI 플랫폼 수요를 반영한 잠정 매출이 기존 전망을 웃돌았습니다. 공급 측 수요 신호이지만 삼성SDS의 확보 물량·납기와 고객 예산을 입증하지 않습니다. 판단 조건: 확정 실적과 고객·제품 믹스, 납기·수주잔고가 공개되면 지속성을 판단할 수 있습니다.\n - DeepL, 연구·개발용 데이터 기반으로 VAST AI OS 도입…기존 하드웨어 저장 용량 3배 목표\n   · VAST Data는 DeepL이 언어·음성 AI 연구·개발 환경에 VAST AI OS를 배치한다고 발표했습니다. 공급사 발표의 배치 계약이며 실제 구축 완료나 전체 운영 환경의 이전을 의미하지 않습니다.\n   · DeepL은 현재 배치 계획에 따라 기존 하드웨어에서 약 3배의 저장 용량을 확보할 것으로 기대한다고 VAST Data가 밝혔습니다. 공급사 발표의 기대치로 측정 방법·기준 용량·완료 결과는 공개되지 않았습니다.\n   · 사업 전망: 기회. DeepL은 기존 하드웨어의 저장 여력을 높이는 데이터 플랫폼을 도입합니다. 삼성SDS도 신규 하드웨어 증설 전 데이터 접근·저장 운영 개선을 고객 제안에서 비교할 수 있습니다. 판단 조건: 실제 배치 결과와 기준 용량·워크로드·비용이 확인돼야 절감       "report": "AI·클라우드 시장 동향 브리핑\n2026-10-16\n2026-11-02 삭제 요청에 따라 해당 분류 기사와 연결된 해설을 제외한 기록입니다.\n\n□ LG CNS, 새마을금고 계정계 최신화 사업 약 2,910억원 수주\n - LG CNS가 새마을금고중앙회의 계정계 최신화 구축 사업을 약 2,910억원에 수주했다고 뉴스핌이 보도했습니다.\n - 계약액은 부가세를 제외한 금액이며, 계약 기간은 2026년 10월 15일부터 2029년 2월 14일까지입니다.\n - 금융 핵심 시스템 시장에서 LG CNS가 새 사업을 확보했지만, 상세 과업과 수익성은 아직 확인되지 않았습니다.\n - 사업 시사점: 유사 사업을 제안할 때 데이터 전환, 검수, 운영 책임을 먼저 비교하고 계약 총액만으로 경쟁 가격을 정하지 않아야 합니다.\n\n□ Meta, Muse Spark Open 가중치 공개…기업은 라이선스와 운영비 따져야\n - Meta가 Muse Spark Open의 가중치를 공개하고 여러 클라우드에서 추론 서비스를 이용할 수 있도록 했습니다.\n - 회사는 코딩과 장시간 에이전트 작업 성능을 강조했으며, 모델에는 Muse Model License가 적용됩니다.\n - 기업의 모델 선택지는 늘었지만 직접 운영할 때의 비용과 상업적 이용 조건을 별도로 확인해야 합니다.\n - 사업 시사점: 고객 업무의 완료율을 같게 맞춘 뒤 API와 직접 호스팅의 비용을 비교하고, 재배포·상업 이용 조건을 확인해야 합니다.\n\n□ TSMC, 올해 설비투자 600억~640억 달러 유지…AI 공급 제약 지속\n - TSMC는 3분기 실적 콜에서 2026년 설비투자 계획을 600억~640억 달러로 유지했습니다.\n - C.C. Wei CEO는 AI 수요가 공급을 크게 웃돈다며 고객의 전력·데이터센터·부품 여건까지 살펴 증설을 판단한다고 설명했습니다.\n - AI 인프라를 조달하는 기업은 반도체 증설 발표와 실제 GPU·서버를 사용할 수 있는 날짜를 구분해야 합니다.\n - 사업 시사점: 구매할 GPU·서버의 견적과 납기에 공급 제약이 반영됐는지 확인하고, 전력과 냉각 준비까지 고객 가동 일정에 포함해야 합니다.\n\n□ UMass Memorial, Accenture·Microsoft와 의료 데이터·AI 전환 추진\n - UMass Memorial Health가 Accenture·Microsoft와 다년간의 의료 데이터 및 AI 전환을 추진합니다.\n - Azure 기반 데이터 현대화를 바탕으로 진료·운영·연구와 에이전트 AI 활용을 함께 다룹니다.\n - 의료 AI 사업에서 모델 도입뿐 아니라 데이터 이전과 시스템 통합이 중요한 과업임을 보여 주지만, 계약 금액과 상세 일정은 공개되지 않았습니다.\n - 사업 시사점: 의료 고객 제안에 데이터 이전·연계·운영을 포함할 수 있는지 살펴보고, 업무별 승인권과 검수 기준을 정해야 합니다.\n\n□ AEP, Mainspring 분산발전 설비 최대 1.6GW 확보 추진\n - AEP가 Mainspring의 다중 연료 발전 설비를 8년에 걸쳐 최대 1.6GW 확보하는 계약을 발표했습니다.\n - 첫 190MW 공급 목표는 2027년이며, 계약의 최대 물량 전체가 당장 가동되는 것은 아닙니다.\n - 데이터센터 전력 부족에 대응할 선택지는 늘고 있지만 실제 부지 적용에는 인허가와 연료 조달, 가동 일정 확인이 필요합니다.\n - 사업 시사점: 발전기 공급일과 데이터센터 가동일을 맞추고 연료·정비 비용을 포함해 계통 전력과 비교해야 합니다.\n\n□ NERC 데이터센터 기준안, 이해관계자 투표 통과…최종 승인 남아\n - NERC의 대형 연산 시설 신뢰성 기준안이 이해관계자 투표를 통과했습니다.\n - 기준안은 100kV 이상 계통에 연결되는 50MW 이상 부하를 대상으로 모델링, 운영 데이터, 통신과 보호 체계 등을 다룹니다.\n - 이사회와 FERC의 후속 절차가 남아 있으며 미국 기준을 국내의 확정 규제로 받아들여서는 안 됩니다.\n - 사업 시사점: 미국 데이터센터 사업을 검토할 때 기준안의 적용 대상과 계통 검토에 필요한 자료를 확인해야 합니다.\n\n□ QumulusAI, 7,190만 달러 Blackwell 계약의 GPU 인도·과금 개시 완료\n - QumulusAI가 지난 7월 체결한 7,190만 달러 Blackwell 계약의 마지막 GPU 인도를 완료했다고 발표했습니다.\n - 회사는 해당 계약에 속한 모든 GPU가 가동되고 과금도 시작됐다고 밝혔습니다.\n - 발표된 계약이 실제 매출 발생 단계에 도달한 사례지만, 회사가 계약한 전체 11.75MW가 모두 가동됐다는 뜻은 아닙니다.\n - 사업 시사점: GPUaaS 계약을 비교할 때 계약 물량과 실제 인도·검수·과금이 완료된 물량을 나누어 확인해야 합니다.\n\n□ KT, AI 데이터센터용 400·800Gbps 전용회선 제공\n - KT가 AI 데이터센터를 연결하는 400·800Gbps 전용회선 서비스를 제공합니다.\n - 중간 변환을 줄이고 여러 경로를 활용하는 구성을 제시했으나 가격과 고객 도입 실적은 공개하지 않았습니다.\n - 분산된 AI 설비를 연결할 선택지가 늘어난 만큼 회선 속도와 실제 작업 성능을 함께 검증해야 합니다.\n - 사업 시사점: GPU 서버 간 작업을 시험해 지연·처리량·장애 전환 성능을 측정하고, 회선료와 이중화 비용을 합쳐 비교해야 합니다.\n\n□ Perplexity, 에이전트 코드 실행 환경 SPACE 공개\n - Perplexity가 Firecracker를 활용한 코드 실행 환경 SPACE를 오픈소스로 공개했습니다.\n - Linux 실행 환경을 생성하고 코드를 실행한 뒤 중지·재개하는 기능을 다룹니다.\n - 기업 에이전트 구축에 활용할 수 있지만 공개 소프트웨어라는 이유만으로 고객의 보안 요건을 충족하는 것은 아닙니다.\n - 사업 시사점: 외부 통신, 비밀정보 접근, 실행 중단·복구를 시험하고 취약점 패치와 장애 대응을 누가 맡을지 정해야 합니다.\n\n□ ASML, 2027년 EUV·DUV 액침 생산능력 약 30% 확대 계획\n - ASML은 10월 14일 실적 콜에서 2027년 EUV와 DUV 액침 장비 생산능력을 약 30% 늘릴 계획이라고 설명했습니다.\n - 회사는 수요가 공급을 웃도는 상황이 2028년까지 이어질 수 있다고 봤으며 협력사 공급 능력도 제약으로 지목했습니다.\n - 반도체 장비 증설에는 시간이 걸리므로 이 계획을 단기 GPU 공급 확대나 가격 하락으로 바로 연결할 수는 없습니다.\n - 사업 시사점: 중장기 조달 계획에서는 장비·웨이퍼·패키징의 증설 일정을 구분하고, 단기 구매는 실제 공급사 견적을 기준으로 판단해야 합니다.\n\n□ Micron, 타이중에 두 번째 첨단 패키징·테스트 시설 개소\n - Micron이 대만 타이중에 두 번째 첨단 패키징·테스트 시설 AATT2를 열었습니다.\n - TechNews는 HBM·AI 수요를 지원할 거점으로 보도했지만 생산능력, 수율과 단계별 증산 일정은 제시하지 않았습니다.\n - 시설이 문을 연 것과 실제 HBM 공급이 얼마나 늘어나는지는 구분해 조달 계획에 반영해야 합니다.\n - 사업 시사점: 시설 개소만으로 납기 개선을 예상하지 말고 단계별 증산·인증 일정과 서버 견적을 함께 확인해야 합니다.\n\n□ 금융권 시각: Larry Fink, 미국 데이터센터 건설 중단 시 경기 충격 경고\n - Fink는 미국에서 데이터센터 건설이 전국적으로 중단될 경우 경기에 큰 충격이 생길 수 있다고 경고했습니다.\n\n□ 금융권 시각: IMF 아태국장, AI 투자에 따른 아시아 반도체·데이터센터 수요 주목\n - Krishna Srinivasan IMF 아태국장은 AI 인프라 수요가 아시아 일부 경제의 반도체와 데이터센터 투자를 뒷받침한다고 설명했습니다.\n\n□ GPU를 확보하는 날과 고객에게 요금을 받는 날을 맞춰야 합니다\n - SCP GPUaaS는 온디맨드와 1년·3년 약정 상품을 안내합니다. 고객에게 제공하는 약정 기간이 공급자에게 돈을 지급하는 기간과 일치하는지는 별도 문제입니다. 고객이 쓰기 전에 조달비가 발생하거나 사       "report": "AI·클라우드 시장 동향 브리핑\n2026-10-14\n2026-11-02 삭제 요청에 따라 해당 분류 기사와 연결된 해설을 제외한 기록입니다.\n\n□ Workday, Sana를 새 기본 홈으로 제공…HR·IT 요청 처리 에이전트는 초기 고객에 공개\n - Workday가 업무와 회의, 에이전트 활동을 모으는 Sana를 새 기본 홈으로 제공한다고 발표했습니다.\n - HR·IT 요청을 처리하는 Sana Concierge는 초기 고객에게 제공 중이며 일반 제공은 2027년 1분기로 예정돼 있습니다.\n - 기업은 기존 정책·권한·승인 절차를 따르는 이 기능이 별도 자동화 구축을 어디까지 대신할 수 있는지 확인해야 합니다.\n - 사업 시사점: HR·IT 자동화 제안에서 SaaS에 포함된 처리 범위와 추가 시스템 연계·예외 처리 비용을 구분하십시오.\n\n□ Trellix, 고객 사설환경에서 동작하는 AI 보안 운영 제품 출시\n - Trellix가 고객 환경 안에서 실행하는 AI 보안 운영 제품 Wise for Private Cloud를 출시했습니다.\n - 회사는 토큰 단위로 과금하지 않고 결과별 신뢰 수준과 설명을 제공한다고 밝혔지만 가격과 실제 사고 처리 성과는 공개하지 않았습니다.\n - 민감한 데이터를 외부로 보내기 어려운 고객에게 활용할 수 있는지 배포·연계 조건과 탐지 품질을 확인할 사안입니다.\n - 사업 시사점: 보안 AI의 데이터 반출 범위, 과금 단위, 감사 증빙을 고객 요구사항과 대조하십시오.\n\n□ Broadcom, ESX 하이퍼바이저 보호 제품 HyperArmor 공개\n - Broadcom이 ESX 호스트를 보호하는 HyperArmor를 공개했습니다.\n - ESX 8.x 이상에서 가상 패치, 실행파일·스크립트 통제와 SSH 로그인 MFA를 제공하며 가상 패치에 재부팅이 필요 없다고 설명했습니다.\n - 공급자의 기능 설명을 실제 운영 환경에서 확인하고 기존 관리 도구와의 충돌 및 라이선스 비용을 따져야 합니다.\n - 사업 시사점: VCF 운영 고객의 패치 창과 호스트 스크립트 승인 절차에 맞춰 호환성과 운영 부하를 검증하십시오.\n\n□ Scuba, 3,400만 달러 조달…팀 자료를 AI 에이전트에 연결하는 제한 베타 공개\n - Scuba가 두 투자 라운드에서 3,400만 달러를 조달하고 팀 대상 제한 베타를 순차 공개합니다.\n - 문서·메모·미디어를 정리하고 MCP로 Claude·ChatGPT·Cursor 등에 연결하는 서비스입니다.\n - 전사 배포에 필요한 권한과 데이터 보존, 감사 기능은 확인되지 않아 기업 AI 플랫폼과의 경쟁 범위를 판단하기에는 이릅니다.\n - 사업 시사점: 팀 단위 자료 수집과 전사 권한·보존 규칙을 분리하고 기업 검색·RAG 제안의 표준 기능 범위를 점검하십시오.\n\n□ 금융권 시각: Jefferies, 저가·개방형 모델이 AI 랩 수익성과 인프라 투자 회수를 압박할 수 있다고 평가\n - Jefferies는 중국·개방형·소형 모델의 가격 경쟁이 대형 AI 랩의 미래 매출을 압박해 하이퍼스케일러의 투자 회수 가정을 흔들 수 있다고 주장했습니다.\n"

const $=s=>document.querySelector(s), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function fullDate(v,anchor){if(/^\d{4}-\d{2}-\d{2}$/.test(v))return v;if(!/^\d{2}\/\d{2}$/.test(v))return null;const base=new Date(`${anchor?.slice(0,10)||'2000-01-01'}T12:00:00Z`),year=base.getUTCFullYear();return [year-1,year,year+1].map(y=>`${y}-${v.replace('/','-')}`).filter(x=>{const d=new Date(x+'T12:00:00Z');return Number.isFinite(+d)&&d.toISOString().slice(0,10)===x;}).sort((a,b)=>Math.abs(new Date(a)-base)-Math.abs(new Date(b)-base))[0];}
function dateLabel(v,anchor){const d=fullDate(v,anchor);if(!d)return esc(v);const date=new Date(d+'T12:00:00Z');return `${d.slice(5,7)}.${d.slice(8,10)} (${['일','월','화','수','목','금','토'][date.getUTCDay()]})`;}

function story(s){return `<article class="story"><div class="story-meta"><span class="category">${esc(s.cat)}</span><span>${importance(s.importance)}</span>${s.followup?'<span class="flag">후속</span>':''}${s.paywall?'<span class="flag caution">유료</span>':''}${!s.verified?'<span class="flag caution">확인 필요</span>':''}${s.outlook?outlookBadge(s.outlook):''}${s.cat==='금융권 시각'&&s.stance?stance(s.stance):''}${s.podref?'<span class="flag">인터뷰</span>':''}</div><h2>${link(s.url,s.title)}</h2><p>${list(s.summary).map(esc).join(' ')}</p>${s.paywall?'<p class="caveat">본문 미확인(제목·리드 기준)</p>':''}${essentialFacts(s)}${articleAnalysis(s.analysis,!!s.top)}${outlookPanel(s.outlook)}<p class="impact"><strong>${s.outlook?'검토 과제':'시사점'}</strong>${esc(s.impact)}</p><p class="source">${esc(s.source)} · ${dateLabel(s.date,edition()?.date)}${list(s.refs).map((r,i)=>link(r.url,`관련 원문 ${i+1} · ${dateLabel(r.date,edition()?.date)}`)).join('')}</p>${s.reaction?`<div class="reaction"><strong>개발자 반응 · Hacker News</strong>${esc(s.reaction)}</div>`:''}</article>`;}

function paragraphs(value,cls=''){return text(value).split(/\n\s*\n/).filter(Boolean).map(s=>`<p class="${cls}">${esc(s)}</p>`).join('');}
function interviewStoryline(x){if(!list(x.storyline).length)return '';return `<section class="interview-storyline" aria-label="대담의 흐름"><h3>대담의 흐름</h3><p class="notice">대담 순서대로 읽는 짧은 맥락입니다. ‘읽는 연결’은 편집자의 해설입니다.</p>${x.storyline.map((y,i)=>`<section class="storyline-step"><h4>${i+1}. ${esc(y.heading)} <span class="point-time">${esc(y.t)}</span></h4>${paragraphs(y.body,'storyline-fact')}<p class="storyline-bridge"><b>읽는 연결</b>${esc(y.bridge)}</p></section>`).join('')}</section>`;}
function interviewBody(x,p){const deep=Array.isArray(x.points);return `<div class="interview-body"><p class="source">공개 ${dateLabel(x.date,p.generatedAt)}${x.guests?' · 출연 '+esc(text(x.guests)):''}${x.basis?' · '+esc(x.basis):''}</p><p class="source">원제 · ${link(x.url,x.title)}</p>${x.reading_note?`<p class="notice">${esc(x.reading_note)}</p>`:''}${deep?`<div class="why"><strong>이 대담에서 읽을 쟁점</strong>${paragraphs(x.why_now)}</div>${paragraphs(x.overview,'interview-overview')}${interviewStoryline(x)}${x.storyline?'<h3 class="debate-heading">깊게 읽을 중심 논쟁</h3>':''}${list(x.points).map((y,i)=>`<section class="interview-point"><h4>${i+1}. ${esc(y.heading)} <span class="point-time">${esc(y.t)}</span></h4>${y.analysis?'<div class="interview-label">대담의 주장 · 근거</div>':''}${paragraphs(y.body,'point-source')}${y.analysis?'<div class="interview-label">사업적 해석</div>'+paragraphs(y.analysis):''}${y.counterpoint?'<div class="interview-counter"><div class="interview-label">성립 조건과 반론</div>'+paragraphs(y.counterpoint)+'</div>':''}</section>`).join('')}${list(x.glossary).length?`<div class="glossary"><strong>용어 노트</strong><dl>${x.glossary.map(y=>`<dt>${esc(y.term)}</dt><dd>${esc(y.plain)}</dd>`).join('')}</dl></div>`:''}<p class="caveat"><strong>읽을 때의 한계</strong> ${esc(text(x.caveats))}</p><div class="action"><b>삼성SDS의 실행 과제</b><ul>${list(x.so_what).map(y=>`<li>${esc(y)}</li>`).join('')}</ul></div>`:paragraphs(x.summary||x.overview)}${list(x.references).length?`<div class="interview-references"><strong>확인한 원문과 보완 자료</strong>${x.references.map(r=>link(r.url,r.title)).join('')}</div>`:''}</div>`;}
function interviewSummary(x,p,label){return `<summary class="interview-summary"><div class="interview-summary-main"><small>${esc(label)} · ${esc(x.podcast)} · ${dateLabel(x.date,p.generatedAt)}</small><h3>${esc(x.headline||x.title)}</h3><p>${esc(text(x.summary||x.why_now||x.overview))}</p></div><span class="interview-toggle" aria-hidden="true"></span></summary>`;}
function renderPodcasts(){const p=BRIEFING.podcasts?.[0];if(!p)return empty('리더 인터뷰가 없습니다','새 에피소드와 중요한 어닝콜을 확인하면 이곳에 정리합니다.');const featured=list(p.deep).slice(0,2);const history=[...list(p.history),...list(p.deep).slice(2).map(x=>({...x,kind:'deep'})),...list(p.others).map(x=>({...x,kind:'others'})),...list(p.minor).map(x=>({...x,kind:'minor'}))].sort((a,b)=>String(fullDate(b.date,p.generatedAt)).localeCompare(String(fullDate(a.date,p.generatedAt))));return `<h2 class="section-head">리더 인터뷰</h2><p class="intro interview-intro">이번 선정 ${featured.length}편을 깊이 읽고, 지난 인터뷰는 필요할 때 펼쳐 보세요. 발언자의 주장과 사업적 해석을 구분했습니다.<br>최근 수집 기간 ${esc(p.period)} · 편집 ${esc(p.generatedAt)}</p><nav class="interview-nav" aria-label="인터뷰 바로가기">${featured.map((x,i)=>`<a href="#interview-feature-${i}">${i+1}. ${esc(x.podcast)}</a>`).join('')}<a href="#interview-history">지난 인터뷰 ${history.length}편 ↓</a></nav><div class="themes">${list(p.themes).map(t=>`<div class="theme"><h3>${esc(t.title)}</h3><p>${esc(t.body)}</p></div>`).join('')}</div>${featured.map((x,i)=>`<details id="interview-feature-${i}" class="card interview-feature podcast-deep" open style="padding:0">${interviewSummary(x,p,'이번 선정 '+(i+1))}${interviewBody(x,p)}</details>`).join('')}${!featured.length?empty('이번에 선정한 심층 인터뷰가 없습니다','지난 인터뷰는 아래에서 계속 읽으실 수 있습니다.'):''}<section id="interview-history" class="interview-history"><div class="toolbar"><h3>지난 인터뷰</h3><button data-collapse-interviews>모두 접기</button></div><p class="intro">제목을 클릭하면 저장된 본문이 펼쳐집니다. 지난 심층·기타 에피소드·참고를 함께 검색합니다.</p><label class="sr-only" for="interviewSearch">지난 인터뷰 검색</label><input id="interviewSearch" class="search" type="search" placeholder="출연자, 방송, 제목 또는 주제로 검색"><p id="interviewCount" class="interview-count" role="status">${history.length}편</p>${history.map(x=>`<details class="interview-history-item" data-interview-search="${esc([x.podcast,x.title,x.headline,text(x.guests),x.summary,x.why_now].filter(Boolean).join(' ').toLowerCase())}">${interviewSummary(x,p,x.kind==='deep'?'심층':x.kind==='others'?'기타 에피소드':'참고')}${interviewBody(x,p)}</details>`).join('')}<div id="interviewNoResults" ${history.length?'hidden':''}>${empty('조건에 맞는 인터뷰가 없습니다','출연자나 주제 등 다른 검색어를 입력해 보세요.')}</div></section>`;}

 '<section class="research-actions"><h4>삼성SDS에서 검토할 일 · 편집 제안</h4>'+list(x.actions).map(a=>'<article><b>'+esc(a.owner)+'</b><p>'+esc(a.task)+'</p><p><strong>확인 자료</strong> · '+esc(a.check)+'</p></article>').join('')+'</section>'+
 '<p class="research-reconsider"><strong>이 판단을 바꿀 조건</strong><br>'+esc(x.reconsider)+'</p><p class="research-source-note">'+link(x.url,researchSummary(x)?'정리글 보기 ↗':researchSubscriber(x)?'원문 기사 보기 ↗':'보고서 원문 PDF ↗')+' · '+(researchSummary(x)?'정리글 확인 ':researchSubscriber(x)?researchAccessLabel(x)+' 확인 ':'익명 열람 확인 ')+esc(researchCheckedDate(x.accessCheckedAt))+'<br>'+esc(researchDateLabel(x))+(researchSummary(x)?' · 원문 발행일 '+esc(x.reportDate||'미확인'):' · 수집처 게시일 '+esc(x.indexedDate))+(x.dateNote?'<br>'+esc(x.dateNote):'')+'</p></div>';}
function researchPiece(x,featured){return '<details id="'+esc(x.id)+'" class="research-piece'+(featured?' research-feature':' research-history-item')+'" '+(featured?'open':'')+' data-research-search="'+esc([x.broker,x.sourceBasis?.channel||'',x.title,x.headline,x.question,x.thesis].join(' ').toLowerCase())+'"><summary><div class="research-meta">'+(featured?'이번 선정 · ':'보관 자료 · ')+esc(x.broker)+' · '+esc(researchDateLabel(x))+'</div><h3>'+esc(x.headline)+'</h3><div class="research-meta">'+(researchSummary(x)?'요약 주제 · ':'원문 · ')+esc(x.title)+'</div>'+(researchSummary(x)?'<p class="research-provenance source">외사 리포트 요약 기반 · 원문 미열람 · 정리: '+esc(x.sourceBasis.channel)+'</p>':researchSubscriber(x)?'<p class="research-provenance source">구독 매체 원문 · 본문 확인 · '+esc(researchAccessLabel(x))+'</p>':'')+'<p class="research-question">'+esc(x.question)+'</p></summary>'+researchBody(x)+'</details>';}
function renderResearch(){const r=BRIEFING.research;if(!r||!list(r.reports).length)return empty('아직 선정한 산업 리서치가 없습니다','공개 보고서·외사 리포트 정리글·구독 매체 원문에서 AI·클라우드 사업의 판단 근거를 찾아 소개합니다.');const featured=list(r.featured).map(id=>r.reports.find(x=>x.id===id)).filter(Boolean),past=r.reports.filter(x=>!r.featured.includes(x.id));return '<div class="research-lead"><p class="eyebrow">INDUSTRY RESEARCH</p><h2>보고서에서 사업의 전제를 읽습니다</h2><p>증권사와 전문 매체의 분석을 고객 수요, 경쟁사의 투자, 서비스 원가의 관점에서 읽습니다. 보고서가 무엇을 근거로 결론에 이르렀는지 살피고, 삼성SDS에 적용할 수 있는 범위와 확인할 조건을 덧붙였습니다.</p><div class="research-meta">편집 '+esc(r.updated)+' · 이번 선정 '+featured.length+'편 · 전체 '+r.reports.length+'편 · 원문일 또는 요약 게시일 표시</div></div><nav class="research-nav" aria-label="산업 리서치 바로가기">'+featured.map(x=>'<a href="#'+esc(x.id)+'">'+esc(x.broker)+' · '+esc(researchDateLabel(x))+'</a>').join('')+'<a href="#research-history">더 읽기·지난 자료 '+past.length+'편 ↓</a></nav>'+featured.map(x=>researchPiece(x,true)).join('')+'<section id="research-history" class="research-history"><div class="toolbar"><h3>더 읽기 · 지난 자료</h3><button data-collapse-research>모두 접기</button></div><p class="intro">제목을 클릭하면 전체 해설을 읽을 수 있습니다. 선정이 바뀌어도 이전 해설을 보존합니다.</p><input id="researchSearch" class="search" type="search" aria-label="산업 리서치 검색" placeholder="기관·매체, 제목, 주제로 검색"><p id="researchCount" class="source" role="status">'+past.length+'편</p>'+past.map(x=>researchPiece(x,false)).join('')+'<p id="researchNoResults" '+(past.length?'hidden':'')+'>조건에 맞는 자료가 없습니다.</p></section><p class="notice">공개 보고서, 신뢰하는 채널의 외사 리포트 요약, 정상적으로 확보한 구독 매체 본문을 함께 읽습니다. 요약 기반 자료는 정리 채널과 원문 미열람 여부를 표시합니다. 구독 매체는 실제 확인한 본문 범위와 경로를 표시하며, 원문 링크는 구독이 필요할 수 있습니다. 증권사의 전망과 편집 해석을 구분하며 목표주가·매매 의견과 수집 전문을 재게시하지 않습니다. 금융권 시각은 발언·금융 여건을, 산업 리서치는 보고서의 논증과 사업 적용을 다룹니다.</p><a class="research-weekly-link" href="#weekly">주간 시사점에서 함께 읽기 →</a>';}

function renderArchive(){return `<h2 class="section-head">아카이브</h2><p class="intro">원문과 사건의 기록 · 최종 갱신 ${esc(BRIEFING.db?.updated||'아직 없음')}</p><div class="archive-count"><span><b>${list(BRIEFING.db?.stories).filter(x=>!x.ref).length}</b> 기사</span><span><b>${list(BRIEFING.db?.podcasts).length}</b> 팟캐스트</span></div><input class="search" id="archiveSearch" type="search" aria-label="아카이브 검색" placeholder="제목, 분류, 회차, 발행일 검색"><div class="table-scroll"><table><thead><tr><th>회차</th><th>분류</th><th>중요도</th><th>제목</th><th>원문 발행일</th></tr></thead><tbody id="archiveRows">${archiveRows()}</tbody></table></div><p class="notice">관련 원문(ref)은 건수·표에서 제외합니다. 일반 목록 URL을 제외한 정규화 URL과 최근 14일 제목 유사도(Dice ≥ 0.62)로 중복을 방지합니다. 새로운 전개가 있는 후속 기사는 별도 표시합니다. 기사는 365일, 회차는 20개를 유지하며 주간 보관본은 별도로 남깁니다.</p>`;}
const GPU_COLORS={AWS:'#1f4fd1',Oracle:'#b45309',Azure:'#7c3aed',Nebius:'#0b7a5c',Lambda:'#bd3766',Hyperstack:'#985b1d',RunPod:'#087f91','Together AI':'#a03981',CoreWeave:'#6554c0',DigitalOcean:'#2474b5'};
const GPU_BILLING={on_demand:'온디맨드',capacity_block:'Capacity Blocks · 선불 예약'};
function gpuMoney(x){return '$'+Number(x).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:3});}
function gpuRegion(s){return s.region==='unspecified'?'공시 지역 미지정':s.region;}
function gpuLatest(g,id){return list(g.observations).filter(o=>o.series===id).sort((a,b)=>b.date.localeCompare(a.date))[0];}
function gpuDay(s){return new Date(Date.parse(s)+9*3600000).toISOString().slice(0,10);}
function gpuContiguous(a,b){for(let t=Date.parse(a+'T00:00:00Z')+86400000;t<Date.parse(b+'T00:00:00Z');t+=86400000){const day=new Date(t).getUTCDay();if(day!==0&&day!==6)return false;}return true;}
function gpuSeries(g){return list(g.series).filter(s=>s.model===state.gpuModel&&(state.gpuBilling==='all'||s.billing===state.gpuBilling)&&(state.gpuGroup==='all'||s.group===state.gpuGroup));}
function gpuChart(g,series){
 const hidden=state.gpuHidden||[],active=series.filter(s=>!hidden.includes(s.id)),end=gpuDay(g.updatedAt),cutoff=state.gpuDays==='all'?'0000-01-01':new Date(Date.parse(end+'T00:00:00Z')-(Number(state.gpuDays)-1)*86400000).toISOString().slice(0,10);
 const all=list(g.observations).filter(o=>o.date>=cutoff&&active.some(s=>s.id===o.series));const valid=all.filter(o=>o.status==='ok');
 if(!valid.length)return empty('표시할 관측값이 없습니다','GPU·과금 방식·업체 범위를 바꾸거나 선택한 계열을 다시 켜 주세요.');
 const days=[...new Set(all.map(o=>o.date))].sort(),start=Date.parse(days[0]+'T00:00:00Z'),last=Date.parse(days.at(-1)+'T00:00:00Z'),mobile=window.innerWidth<650,W=mobile?600:1000,H=mobile?400:330,L=64,R=36,T=35,B=55,max=Math.ceil(Math.max(...valid.map(o=>o.price))*1.18/2)*2;
 const px=d=>L+(last===start?0.5:(Date.parse(d+'T00:00:00Z')-start)/(last-start))*(W-L-R),py=v=>H-B-v/max*(H-T-B);let svg='';
 for(let i=0;i<=4;i++){const value=max*i/4,y=py(value);svg+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="#e4e7ec"/><text x="${L-13}" y="${y+5}" text-anchor="end">${value.toFixed(value%1?1:0)}</text>`;}
 const labelY=new Map();if(days.length===1){let previousY=T-30;for(const o of [...valid].sort((a,b)=>b.price-a.price)){const y=Math.max(py(o.price)+4,previousY+(mobile?26:18));labelY.set(o.series,y);previousY=y;}}

function dcXY(lon,lat){return [(lon-125)*90+15,(38.8-lat)*115+10];}
function dcFilteredProjects(){const d=BRIEFING.datacenters;if(!d)return [];return d.projects.filter(p=>(state.dcRegion==='전체'||p.regionName===state.dcRegion)&&(state.dcStage==='전체'||p.stage===state.dcStage)&&(!state.dcQuery||[p.name,p.operator,p.location,p.capacityText].join(' ').toLowerCase().includes(state.dcQuery.toLowerCase())));}
function dcMapGroups(){const m=new Map(),size=(state.dcMapBox||[0,0,620,690])[2]/13;for(const p of dcFilteredProjects()){const pos=p.geo?[p.geo.lon,p.geo.lat]:DC_ANCHORS[p.regionName];if(!pos)continue;const [x,y]=dcXY(...pos),key=Math.floor(x/size)+','+Math.floor(y/size);if(!m.has(key))m.set(key,{key,pos:[0,0],approx:false,projects:[],labels:new Set()});const g=m.get(key);g.pos[0]+=pos[0];g.pos[1]+=pos[1];g.projects.push(p);g.approx=g.approx||!p.geo||p.geo.precision!=='시설';g.labels.add(size>25?p.regionName:(p.geo?.label||p.regionName));}return [...m.values()].map(g=>({...g,pos:g.pos.map(v=>v/g.projects.length),label:[...g.labels].join('·'),approx:g.approx||g.projects.length>1}));}

function dcPie(ps,r){const counts={};ps.forEach(p=>counts[p.stage]=(counts[p.stage]||0)+1);let angle=-Math.PI/2;const entries=Object.entries(counts);if(entries.length===1)return `<circle r="${r}" fill="${DC_COLORS[entries[0][0]]}"/>`;return entries.map(([s,n])=>{const end=angle+2*Math.PI*n/ps.length,x1=r*Math.cos(angle),y1=r*Math.sin(angle),x2=r*Math.cos(end),y2=r*Math.sin(end);const d=`M0,0 L${x1},${y1} A${r},${r} 0 ${end-angle>Math.PI?1:0},1 ${x2},${y2} Z`;angle=end;return `<path d="${d}" fill="${DC_COLORS[s]}"/>`;}).join('');}
function dcMap(){const groups=dcMapGroups(),box=state.dcMapBox||[0,0,620,690];return `<div class="dc-map-frame"><div class="dc-map-tools"><button data-map-view="all">전국</button><button data-map-view="capital">수도권 확대</button><button data-map-zoom="in" aria-label="지도 확대">＋</button><button data-map-zoom="out" aria-label="지도 축소">−</button></div><svg id="dcMap" viewBox="${box.join(' ')}" role="img" aria-label="국내 데이터센터 위치와 운영·건설·계획 지도"><rect x="-1000" y="-1000" width="3000" height="3000" fill="#eef4f7"/><g class="dc-coast">${DC_LAND}</g>${groups.map(g=>{const [x,y]=dcXY(...g.pos),r=8+Math.sqrt(g.projects.length)*2.5;return `<g class="dc-map-point" transform="translate(${x},${y})" role="button" tabindex="0" data-map-group="${esc(g.key)}" aria-label="${esc(g.label)} ${g.projects.length}개 센터 보기"><title>${esc(g.label)} · ${g.approx?'권역 대표 위치':'시설 위치'}\n${g.projects.map(p=>esc(p.name+' · '+p.stage+' · '+p.capacityText)).join('\n')}</title>${dcPie(g.projects,r)}<circle r="${r+2}" fill="none" stroke="${g.approx?'#64748b':'#fff'}" stroke-dasharray="${g.approx?'3 3':'none'}"/><text text-anchor="middle" y="4" fill="white" font-size="12" font-weight="700">${g.projects.length}</text><text text-anchor="middle" y="${r+15}" fill="#243450" font-size="11" paint-order="stroke" stroke="#eef4f7" stroke-width="3">${esc(g.label.replace(/(특별자치|광역|특별)시/g,'').slice(0,12))}</text></g>`;}).join('')}<text x="30" y="670" font-size="11" fill="#62758a">숫자 = 수록 센터 수 · 점선 = 시군구/권역 대표 위치</text></svg><div class="dc-map-legend">${Object.entries(DC_COLORS).map(([s,color])=>`<span><i style="background:${color}"></i>${s}</span>`).join('')}</div><p class="source">지도를 끌어 이동하거나 확대할 수 있습니다. 원을 누르면 해당 센터 목록을 봅니다. 정확한 부지가 확인되지 않은 곳은 권역 위치로 표시합니다. 경계: <a href="https://www.naturalearthdata.com/about/terms-of-use/" target="_blank" rel="noopener noreferrer">Natural Earth</a>.</p></div>`;}

function dcAnnualCharts(d){const a=d.annual;if(!a)return '';const selected=state.dcAnnualCompany||'amazon-aws',series=a.series.filter(x=>selected==='all'||x.companyId===selected);const max=Math.max(1,Math.ceil(Math.max(...a.series.flatMap(x=>x.points.map(p=>(p.operatingMW+p.constructionMW+p.plannedMW)/1000)))));const gw=n=>(n/1000).toLocaleString('ko-KR',{minimumFractionDigits:2,maximumFractionDigits:2});const stages=[['operatingMW','운영·가동 전망','운영'],['constructionMW','건설 중 잔여(확인분)','건설'],['plannedMW','계획·착공 범위 미확인','계획']];return `<section class="dc-annual"><div class="dc-annual-heading"><div><span class="eyebrow">COMPANY × YEAR · GW</span><h3>기업별·연도별 용량</h3></div><label>기업 선택 <select id="dcAnnualCompany"><option value="all" ${selected==='all'?'selected':''}>7개사 한눈에</option>${d.companies.map(x=>`<option value="${esc(x.id)}" ${selected===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label></div><p class="dc-annual-scope"><b>대형 AI 시설 추적분 · IT 전력 GW</b><br>${esc(a.scope)} 현재는 ${esc(a.asOf)} 추정, 이후 연도는 연말 가동 일정에 따른 조건부 전망입니다.</p><div class="dc-map-legend">${stages.map(([key,label,color])=>`<span><i style="background:${DC_COLORS[color]}"></i>${label}</span>`).join('')}</div><div class="dc-annual-grid ${selected==='all'?'all':''}">${series.map(x=>{const date=state.dcAnnualDate||'2027-12-31',point=x.points.find(p=>p.date===date)||x.points[0];return `<article class="dc-annual-company"><h4>${esc(d.companies.find(c=>c.id===x.companyId).name)}</h4><p class="source">${esc(x.scope)} · ${x.sites.length}개 시설</p><aside class="dc-fleet-reference">${esc(x.referenceText)} <span>${x.referenceSources.map(s=>link(s.url,s.title)).join(' · ')}</span></aside><div class="dc-year-chart" role="img" aria-label="${esc(x.companyId)} 기업별 연도말 단계별 IT GW 막대그래프. 아래 표에 정확한 수치가 있습니다."><div class="dc-y-axis"><span>${max} GW</span><span>${max/2}</span><span>0</span></div><div class="dc-year-bars">${x.points.map(p=>`<button class="dc-year-column ${p.kind==='전망'?'forecast':''} ${p.date===point.date?'selected':''}" data-dc-annual-date="${p.date}" aria-label="${esc(p.label)} ${esc(p.kind)} 운영 ${gw(p.operatingMW)} 건설 ${gw(p.constructionMW)} 계획 ${gw(p.plannedMW)} GW"><span class="dc-year-stack">${stages.map(([key,label,color])=>`<span class="dc-year-segment" style="height:${p[key]/1000/max*100}%;background:${DC_COLORS[color]}" title="${esc(label)} ${gw(p[key])} GW">${p[key]/1000/max>.08?gw(p[key]):''}</span>`).join('')}</span><strong>${esc(p.label)}</strong><small>${p.kind==='전망'?'연말 전망':'현재 추정'}</small></button>`).join('')}</div></div><div class="table-scroll"><table class="dc-year-table"><thead><tr><th>IT GW</th>${x.points.map(p=>`<th>${esc(p.label)}</th>`).join('')}</tr></thead><tbody>${stages.map(([key,label,color])=>`<tr><th><i style="background:${DC_COLORS[color]}"></i>${label}</th>${x.points.map(p=>`<td>${gw(p[key])}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="source">동일하게 추적하는 시설 안에서 가동 전망이 늘고 잔여 용량이 줄어드는 구조입니다. 계획 0은 이 표본의 남은 물량이 0이라는 뜻이며, 회사의 신규 계획이 없다는 뜻이 아닙니다.</p><details class="dc-year-evidence"><summary>${esc(point.label)} 막대의 시설별 구성·출처</summary><p>막대를 선택하면 해당 연도의 계산 근거를 볼 수 있습니다.</p><div class="table-scroll"><table><thead><tr><th>시설</th><th>운영</th><th>건설</th><th>계획</th><th>단계 판단</th></tr></thead><tbody>${x.sites.map(s=>{const rows=s.forecast.filter(p=>p.date<=point.date),o=rows.length?rows.at(-1).mw:0,b=Math.max(0,s.constructionCeilingMW-o),p=Math.max(0,s.totalMW-Math.max(s.constructionCeilingMW,o));return `<tr><th>${link(s.sourceUrl,s.name)}</th><td>${gw(o)}</td><td>${gw(b)}</td><td>${gw(p)}</td><td>${esc(s.note)}</td></tr>`;}).join('')}</tbody></table></div></details></article>`;}).join('')}</div><details class="dc-annual-method"><summary>집계 방법·포함 범위·전망의 가정</summary><ul>${a.methodology.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p>출처: ${a.sources.map(s=>link(s.url,s.title)).join(' · ')}. 원자료를 기업·연말 단위로 재집계하고 단계 판정을 추가했습니다.</p></details></section>`;}

function dcCapacityCharts(d){const phase=state.dcGlobalPhase||'전체',basis=state.dcGlobalBasis||'전체';const selectRows=x=>list(x.capacity).filter(r=>(phase==='전체'||r.phase===phase)&&(basis==='전체'||r.basis===basis));const max=Math.max(1000,Math.ceil(Math.max(1,...d.companies.flatMap(x=>selectRows(x).map(v=>v.mw)))/1000)*1000);return `<section class="dc-charts"><h3>공개 자료에서 확인한 용량</h3><p>막대 하나가 발표 하나입니다. 전사 총량·개별 프로젝트·증설분·컴퓨트 계약을 표시하며, 겹칠 수 있는 숫자는 합산하지 않습니다. 모든 막대의 눈금은 ${Math.ceil(max/1000)} GW까지 동일합니다.</p><div class="dc-chart-filter"><label>사업 단계 <select id="dcGlobalPhase">${['전체','운영','건설','계획'].map(s=>`<option ${s===phase?'selected':''}>${s}</option>`).join('')}</select></label><label>용량 기준 <select id="dcGlobalBasis">${['전체','IT부하','시설전력','컴퓨트','발전'].map(s=>`<option ${s===basis?'selected':''}>${s}</option>`).join('')}</select></label></div><div class="dc-map-legend">${['운영','건설','계획'].map(s=>`<span><i style="background:${DC_COLORS[s]}"></i>${s}</span>`).join('')}</div><div class="dc-company-charts">${d.companies.map(x=>`<section class="dc-chart-company"><header><h4>${esc(x.name)}</h4><a href="#dc-company-${esc(x.id)}">근거·계약 보기 →</a></header>${selectRows(x).length?selectRows(x).map(v=>`<div class="dc-chart-row"><div class="dc-bar-label">${esc(v.label)} <small>${esc(v.phase)} · ${esc(v.scope)} · ${esc(v.basis)}</small></div><div class="dc-bar-line"><div class="dc-bar-track"><span style="width:${v.mw/max*100}%;background:${DC_COLORS[v.phase]}"></span></div><b>${(v.mw/1000).toLocaleString('ko-KR',{maximumFractionDigits:3})} <small>GW</small></b></div><details><summary>기준일·인도 일정·수치 해석</summary><p>${esc(v.note)}</p><p>자료 기준 ${esc(v.asOf)} · ${esc(v.delivery)}</p>${link(v.sourceUrl,'용량 근거 원문')}</details></div>`).join(''):'<p class="notice">이 조건에 맞는 수치가 없습니다. 전체 단계·기준으로 바꾸면 다른 확인 자료를 볼 수 있습니다.</p>'}<p class="source">${esc(x.researchNote||x.limitation)}</p></section>`).join('')}</div></section>`;}
document.addEventListener('click',e=>{const g=e.target.closest('[data-map-group]');if(g){const group=dcMapGroups().find(x=>x.key===g.dataset.mapGroup);state.dcMapIDs=group.projects.map(x=>x.id);updateDCRows();$('#dcResultCount')?.scrollIntoView({block:'nearest',behavior:'smooth'});}const v=e.target.closest('[data-map-view]');if(v){state.dcMapBox=v.dataset.mapView==='capital'?[130,110,200,220]:[0,0,620,690];state.dcMapIDs=null;updateDCMap();updateDCRows();}const z=e.target.closest('[data-map-zoom]');if(z){const [x,y,w,h]=state.dcMapBox||[0,0,620,690],factor=z.dataset.mapZoom==='in'?.7:1.4,nw=Math.max(45,Math.min(1000,w*factor)),nh=nw*h/w;state.dcMapBox=[x+(w-nw)/2,y+(h-nh)/2,nw,nh];updateDCMap();}if(e.target.closest('[data-map-clear]')){state.dcMapIDs=null;updateDCRows();}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-map-group]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}});
document.addEventListener('change',e=>{if(e.target.id==='dcGlobalPhase'||e.target.id==='dcGlobalBasis'){state[e.target.id]=e.target.value;renderTab('datacenters');}});
let dcDrag=null;
document.addEventListener('pointerdown',e=>{const svg=e.target.closest('#dcMap');if(!svg||e.target.closest('[data-map-group]'))return;dcDrag={svg,x:e.clientX,y:e.clientY,box:[...(state.dcMapBox||[0,0,620,690])]};svg.setPointerCapture(e.pointerId);});
document.addEventListener('pointermove',e=>{if(!dcDrag)return;const {svg,x,y,box}=dcDrag,rect=svg.getBoundingClientRect(),ratio=box[2]/rect.width;state.dcMapBox=[box[0]-(e.clientX-x)*ratio,box[1]-(e.clientY-y)*ratio,box[2],box[3]];svg.setAttribute('viewBox',state.dcMapBox.join(' '));});
document.addEventListener('pointerup',()=>{dcDrag=null;});document.addEventListener('pointercancel',()=>{dcDrag=null;});

function renderDatacenters(){const d=BRIEFING.datacenters;if(!d)return empty('데이터센터 현황을 준비하고 있습니다','공개 자료에서 운영 상태·건설 계획·용량을 확인한 뒤 반영합니다. 과거 주간 보관본에는 현재 현황을 넣지 않습니다.');const global=state.dcView==='global',counts=s=>d.projects.filter(p=>p.stage===s).length;return `<div class="dc-heading"><p class="eyebrow">DATA CENTER OBSERVATORY</p><h2 class="section-head">데이터센터 현황</h2><p class="intro">국내 센터의 운영·건설·계획과 글로벌 주요 기업의 용량 확보를 구분해 봅니다. 자료 갱신 ${esc(d.updatedAt)}</p></div><div class="dc-switch"><button data-dc-view="korea" aria-pressed="${!global}">국내 · 전국 현황</button><button data-dc-view="global" aria-pressed="${global}">글로벌 · 7개 기업 용량</button></div>${global?renderDCGlobal(d):`<div class="dc-coverage"><b>전국을 대상으로 수집한 공개 현황</b><p>${esc(d.coverage.scope)}</p><details><summary>수록 범위·누락·출처 확인</summary><p>${esc(d.coverage.limitations)}</p><p class="source">통계·목록 기준 ${esc(d.coverage.asOf)} · ${dcSources(d.coverage.sources)}</p></details></div><div class="dc-stats">${['운영','부분 가동','건설','계획','확인 필요'].map(s=>`<button data-dc-stage="${s}" aria-pressed="${state.dcStage===s}"><span>${s}</span><strong>${counts(s)}<small>개</small></strong><em>이 대시보드 수록 건수</em></button>`).join('')}</div><div class="dc-map-layout"><div id="dcMapHost">${dcMap()}</div><div><aside class="dc-regions"><h3>시도별 탐색</h3><button data-dc-region="전체" aria-pressed="${state.dcRegion==='전체'}">전국 <b>${d.projects.length}</b></button><div class="dc-region-grid">${DC_REGIONS.map(r=>`<button data-dc-region="${r}" aria-pressed="${state.dcRegion===r}">${r}<b>${d.projects.filter(x=>x.regionName===r).length}</b></button>`).join('')}</div><p>수록되지 않은 센터와 비공개 사업이 있습니다. 용량은 센터별 기준을 확인하며 합산하지 않습니다.</p></aside><section class="dc-results"><div class="dc-filter"><label>진행 단계<select id="dcStage">${['전체','운영','부분 가동','건설','계획','확인 필요'].map(s=>`<option ${state.dcStage===s?'selected':''}>${s}</option>`).join('')}</select></label><label>센터·사업자·지역 검색<input id="dcSearch" type="search" value="${esc(state.dcQuery)}" placeholder="사업자와 관계없이 검색"></label></div><div class="toolbar"><h3>${esc(state.dcRegion)} · 센터별 현황</h3><span id="dcResultCount" role="status">${dcProjects().length}개 수록 사업</span></div><p class="notice">상태는 각 원문의 기준일에 확인된 단계입니다. 목표일이 지났다고 자동으로 ‘운영’으로 바꾸지 않습니다. 센터를 펼치면 근거·일정·미확인 범위를 볼 수 있습니다.</p><div id="dcProjectRows">${dcRows()}</div></section></div></div>`}`;}
function renderDCGlobal(d){return `${dcAnnualCharts(d)}<details class="dc-announcement-details"><summary>개별 프로젝트·계약 발표 수치 펼치기</summary>${dcCapacityCharts(d)}</details><details class="dc-text-comparison"><summary>기업별 설명 비교표 펼치기</summary><div class="table-scroll dc-global"><table><caption class="sr-only">주요 7개 기업의 공개 운영·약정·계획 용량</caption><thead><tr><th>기업</th><th>운영·가동 확인</th><th>임차·구매 약정</th><th>향후 개발·목표</th></tr></thead><tbody>${d.companies.map(x=>`<tr><th scope="row"><a href="#dc-company-${esc(x.id)}">${esc(x.name)}</a><small>조회 ${esc(x.checkedAt)}</small></th><td>${esc(x.operatingText)}</td><td>${esc(x.contractedText)}</td><td>${esc(x.plannedText)}</td></tr>`).join('')}</tbody></table></div></details>${d.companies.map(x=>`<details class="dc-company" id="dc-company-${esc(x.id)}"><summary><strong>${esc(x.name)}</strong><span>확보 방식·인도 시점·출처 보기</span></summary><div class="dc-detail"><p class="caveat">${esc(x.limitation)}</p>${x.commitments.map(v=>`<section class="dc-commitment"><h4>${link(v.sourceUrl,v.name)}</h4><p><b>${esc(v.capacityText)}</b> · ${esc(v.stage)}</p><p>${esc(v.relationship)}</p><p>인도·가동: ${esc(v.delivery)}</p></section>`).join('')}<p class="source">${dcSources(x.sources)}</p></div></details>`).join('')}`;}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(b?.dataset.dcView){state.dcView=b.dataset.dcView;renderTab('datacenters');}if(b?.dataset.dcRegion){state.dcMapIDs=null;state.dcRegion=b.dataset.dcRegion;renderTab('datacenters');}if(b?.dataset.dcStage){state.dcMapIDs=null;state.dcStage=state.dcStage===b.dataset.dcStage?'전체':b.dataset.dcStage;renderTab('datacenters');}});
document.addEventListener('change',e=>{if(e.target.id==='dcStage'){state.dcMapIDs=null;state.dcStage=e.target.value;renderTab('datacenters');}});
document.addEventListener('input',e=>{if(e.target.id==='dcSearch'){state.dcMapIDs=null;state.dcQuery=e.target.value;updateDCRows();updateDCMap();}});

function renderMethod(){return renderBaseline()+$('#methodTemplate').innerHTML;}
function comparisonEpisode(x,label){return `<article class="comparison-column"><header><span class="comparison-label">${esc(label)}</span><h3>${esc(x.headline||x.title)}</h3><p class="source">${esc(x.podcast)} · ${dateLabel(x.date,x.date)} · ${list(x.points).length}개 논점</p></header><p class="notice">${esc(x.reading_note)}</p><div class="why">${paragraphs(x.why_now)}</div>${paragraphs(x.overview)}${list(x.points).map((p,i)=>`<details class="compare-point" ${i===0?'open':''}><summary>${i+1}. ${esc(p.heading)} <span>${esc(p.t)}</span></summary><div class="interview-label">대담의 주장 · 근거</div>${paragraphs(p.body)}<div class="interview-label">사업적 해석</div>${paragraphs(p.analysis)}<div class="interview-counter"><div class="interview-label">성립 조건과 반론</div>${paragraphs(p.counterpoint)}</div></details>`).join('')}<div class="action"><b>실행 과제 · 편집자 제안</b><ul>${list(x.so_what).map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div><p class="caveat">${esc(text(x.caveats))}</p>${list(x.references).map(r=>`<p class="source">${link(r.url,r.title)}</p>`).join('')}</article>`;}
function renderComparison(mode='edit'){const c=BRIEFING.comparison;if(!c)return empty('편집 비교가 없습니다','브리핑 탭에서 발행된 내용을 확인해 주세요.');const review=mode==='review';return `<div class="comparison-heading"><p class="eyebrow">EDITORIAL COMPARISON · ${esc(c.createdAt)}</p><h2>${esc(c.title)}</h2><span class="flag caution">도입 전 편집 비교 기록</span><p>${esc(c.notes[0])}</p><button data-go="podcasts">리더 인터뷰로 돌아가기</button><br><a href="#interviews">전체 흐름을 반영한 현재 인터뷰 읽기 →</a></div><div class="comparison-controls" aria-label="비교 단계"><button data-compare="edit" aria-pressed="${!review}">4 · 논쟁 중심 편집</button><button data-compare="review" aria-pressed="${review}">5 · 독립 검토의 효과</button><button data-compare-expand="open">논점 모두 펼치기</button><button data-compare-expand="close">논점 모두 접기</button></div><div class="comparison-context"><b>${review?'초안에서 실제로 수정한 세 가지':'폭넓은 회차 해설과 한 논쟁의 심화'}</b><p>${esc(review?c.notes[2]:c.notes[1])}</p><p>${esc(review?c.notes[4]:c.notes[3])}</p></div>${review?`<div class="review-deltas">${c.review.map((r,i)=>`<article><h3>${i+1}. ${esc(r.heading)}</h3><p><b>검토 전</b><del>${esc(r.before)}</del></p><p><b>수정 후</b><ins>${esc(r.after)}</ins></p><p>${esc(r.why)} ${link(r.source,'검토 근거 ↗')}</p></article>`).join('')}</div>`:''}<div class="comparison-grid">${comparisonEpisode(review?c.draft:c.original,review?'검토 전 초안':'기존 공개본')}${comparisonEpisode(review?c.revised:c.draft,review?'독립 검토 후 수정본':'논쟁 중심 초안')}</div><div class="comparison-context"><b>비교해서 판단할 점</b><p>회차 전체를 파악하는 데 필요한 정보가 충분한지, 사업 판단의 범위가 근거와 맞는지, 반대 경로와 다음 확인 과제가 구체적인지 비교해 주세요. 짧아졌다는 이유나 검토를 거쳤다는 이유만으로 개선됐다고 판정하지 않습니다.</p></div>`;}
function showComparison(mode='edit'){try{state.comparison=mode;document.querySelectorAll('[role=tabpanel]').forEach(p=>p.hidden=true);document.querySelectorAll('[role=tab]').forEach(b=>{b.setAttribute('aria-selected','false');b.tabIndex=b.dataset.tab==='daily'?0:-1;});$('#comparisonPage').hidden=false;$('#comparisonPage').innerHTML=renderComparison(mode);}catch(e){console.error(e);$('#comparisonPage').innerHTML=empty('비교 내용을 표시하지 못했습니다');}}
function comparisonRoute(){if(['#report','#insights','#archive','#method'].includes(location.hash)){showTab(location.hash.slice(1),true);return true;}if(location.hash==='#weekly-report'){state.weeklyReport=true;showTab('weekly',true);return true;}if(location.hash==='#datacenters'||location.hash.startsWith('#dc-company-')){if(location.hash.startsWith('#dc-company-'))state.dcView='global';showTab('datacenters',true);const el=document.getElementById(location.hash.slice(1));if(el){el.open=true;requestAnimationFrame(()=>el.scrollIntoView({block:'start'}));}return true;}if(location.hash==='#gpu'){showTab('gpu',true);return true;}if(location.hash==='#weekly'){showTab('weekly',true);return true;}if(location.hash==='#research'||/^#research-(history|[a-f0-9]{16})$/.test(location.hash)){if(state.tab!=='research'||state.comparison)showTab('research',true);const target=document.getElementById(location.hash.slice(1));if(target){if(target.tagName==='DETAILS')target.open=true;requestAnimationFrame(()=>target.scrollIntoView({block:'start'}));}return true;}if(location.hash==='#interviews'||/^#interview-(feature-\d+|history)$/.test(location.hash)){if(state.tab!=='podcasts'||state.comparison)showTab('podcasts',true);const target=document.getElementById(location.hash.slice(1));if(target)requestAnimationFrame(()=>target.scrollIntoView({block:'start'}));return true;}if(location.hash==='#compare-edit'||location.hash==='#compare-review'){showComparison(location.hash.endsWith('review')?'review':'edit');return true;}return false;}
window.addEventListener('hashchange',()=>{if(!comparisonRoute()&&state.comparison)showTab(state.tab||'daily');});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(b?.dataset.compare){const hash='#compare-'+b.dataset.compare;if(location.hash===hash)showComparison(b.dataset.compare);else location.hash=hash;}if(b?.dataset.compareExpand)document.querySelectorAll('.compare-point').forEach(x=>x.open=b.dataset.compareExpand==='open');});
const renderers={daily:renderDaily,insights:renderInsights,report:renderReport,weekly:renderWeekly,podcasts:renderPodcasts,research:renderResearch,gpu:renderGPU,datacenters:renderDatacenters,archive:renderArchive,method:renderMethod};
function renderTab(tab){const panel=$(`#panel-${tab}`);try{panel.innerHTML=renderers[tab]();panel.removeAttribute('data-error');if(tab==='method'&&!list(BRIEFING.editions).length)$('#methodEmpty').innerHTML=empty('아직 수집된 브리핑이 없습니다','아래 소스와 편집 기준으로 첫 회차를 준비합니다.');}catch(e){console.error(e);panel.dataset.error='true';panel.innerHTML=empty('이 탭을 표시하지 못했습니다','다른 탭은 계속 이용하실 수 있습니다. 데이터 형식을 확인해 주세요.');}}
function showTab(tab,preserveHash=false){if(!renderers[tab])return;state.comparison=null;$('#comparisonPage').hidden=true;if(!preserveHash&&(['#report','#insights','#archive','#method','#weekly-report'].includes(location.hash)||location.hash==='#datacenters'||location.hash.startsWith('#dc-company-')||location.hash==='#gpu'||location.hash==='#weekly'||/^#research/.test(location.hash)||/^#compare-/.test(location.hash)||location.hash==='#interviews'||/^#interview-(feature-\d+|history)$/.test(location.hash)))history.replaceState(null,'',location.pathname+location.search);state.tab=tab;document.querySelectorAll('[role=tab]').forEach(b=>{const active=b.dataset.tab===tab;b.setAttribute('aria-selected',active);b.tabIndex=active?0:-1;});document.querySelectorAll('[role=tabpanel]').forEach(p=>p.hidden=p.id!==`panel-${tab}`);renderTab(tab);const activeButton=document.querySelector('[role=tab][aria-selected=true]'),tabs=document.querySelector('[role=tablist]');if(activeButton&&tabs){const b=activeButton.getBoundingClientRect(),t=tabs.getBoundingClientRect();if(b.left<t.left||b.right>t.right)tabs.scrollLeft+=b.left-t.left-(tabs.clientWidth-b.width)/2;}}
async function copyReport(id){const el=document.getElementById(id),html=`<html><body><div style="font-family:Batang,'바탕',serif;font-size:14pt;">${el.innerHTML}</div></body></html>`;let ok=false;try{await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([el.innerText],{type:'text/plain'})})]);ok=true;}catch{const copy=document.createElement('div');copy.contentEditable='true';copy.innerHTML=html;copy.style.cssText='position:fixed;left:-9999px;';document.body.append(copy);const selection=window.getSelection(),range=document.createRange();range.selectNodeContents(copy);selection.removeAllRanges();selection.addRange(range);try{ok=document.execCommand('copy');}catch{}finally{selection.removeAllRanges();copy.remove();}}$(`#panel-${state.tab} .status`).textContent=ok?'서식과 함께 복사했습니다. Word에 붙여 넣으세요.':'복사를 완료하지 못했습니다. 보고서 내용을 선택해 직접 복사해 주세요.';}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;try{if(b.dataset.tab||b.dataset.go)showTab(b.dataset.tab||b.dataset.go);if(b.dataset.cat){state.category=b.dataset.cat;renderTab('daily');}if(b.dataset.weekMode){state.weeklyReport=b.dataset.weekMode==='report';renderTab('weekly');}if(b.hasAttribute('data-collapse-research'))document.querySelectorAll('.research-history-item[open]').forEach(x=>x.open=false);if(b.hasAttribute('data-collapse-interviews'))document.querySelectorAll('.interview-history-item[open]').forEach(x=>x.open=false);if(b.dataset.copy)void copyReport(b.dataset.copy);if(b.dataset.print){document.querySelectorAll('.print-target').forEach(x=>x.classList.remove('print-target'));document.getElementById(b.dataset.print).classList.add('print-target');window.print();}}catch(err){console.error(err);}});
document.addEventListener('change',e=>{if(e.target.id==='editionSelect'){state.edition=e.target.value;state.category='전체';renderTab(state.tab);}if(e.target.id==='weekSelect'){state.week=e.target.value;renderTab('weekly');}});
document.addEventListener('input',e=>{if(e.target.id==='researchSearch'){const q=e.target.value.trim().toLowerCase();let n=0;document.querySelectorAll('.research-history-item').forEach(x=>{x.hidden=!x.dataset.researchSearch.includes(q);if(!x.hidden)n++;});$('#researchCount').textContent=n+'편';$('#researchNoResults').hidden=n>0;}if(e.target.id==='archiveSearch')$('#archiveRows').innerHTML=archiveRows(e.target.value);if(e.target.id==='interviewSearch'){const q=e.target.value.trim().toLowerCase();let n=0;document.querySelectorAll('.interview-history-item').forEach(x=>{x.hidden=!x.dataset.interviewSearch.includes(q);if(!x.hidden)n++;});$('#interviewCount').textContent=n+'편';$('#interviewNoResults').hidden=n>0;}});
document.querySelector('[role=tablist]').addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;const tabs=[...document.querySelectorAll('[role=tab]')],i=tabs.indexOf(document.activeElement);let n=e.key==='Home'?0:e.key==='End'?tabs.length-1:(i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;e.preventDefault();showTab(tabs[n].dataset.tab);tabs[n].focus();});
try{if(list(BRIEFING.editions).length)$('#editionSelect').innerHTML=BRIEFING.editions.map(e=>`<option value="${esc(e.id)}">${dateLabel(e.date,e.date)} ${esc(e.slot)}</option>`).join('');else $('#editionSelect').disabled=true;if(BRIEFING.archive){$('#archiveBadge').hidden=false;$('#archiveBadge').textContent=`${BRIEFING.archive.label} · ${BRIEFING.archive.period}`;}$('#compareLink').hidden=!BRIEFING.comparison||!!BRIEFING.archive;if(!comparisonRoute())showTab(state.tab);}catch(e){console.error(e);$('#panel-daily').innerHTML=empty('데이터를 읽지 못했습니다','브리핑 데이터 블록을 확인해 주세요.');}
</script>
</body>
</html>
